name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bertsonal
          POSTGRES_PASSWORD: bertsonal_pw
          POSTGRES_DB: bertsonal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bertsonal -d bertsonal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_TEST_HOST: localhost
      POSTGRES_TEST_PORT: "5432"
      POSTGRES_USER: bertsonal
      POSTGRES_PASSWORD: bertsonal_pw
      POSTGRES_DB: bertsonal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt

      - name: Set up Java 17 (PySpark runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt -r requirements/simulator.txt -r requirements/spark.txt

      - name: Run tests
        run: ./scripts/test.sh -ra
