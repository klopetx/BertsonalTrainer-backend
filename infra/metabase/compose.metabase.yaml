name: bertsonaltrainer-metabase

services:
  metabase-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${MB_POSTGRES_USER:-metabase}
      POSTGRES_PASSWORD: ${MB_POSTGRES_PASSWORD:-metabase_pw}
      POSTGRES_DB: ${MB_POSTGRES_DB:-metabase}
    ports:
      # Avoid clashing with the project's main Postgres (typically 5432).
      - "5433:5432"
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${MB_POSTGRES_USER:-metabase} -d ${MB_POSTGRES_DB:-metabase}"
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      metabase-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Store Metabase application metadata in the dedicated DB above.
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${MB_POSTGRES_DB:-metabase}
      MB_DB_PORT: "5432"
      MB_DB_USER: ${MB_POSTGRES_USER:-metabase}
      MB_DB_PASS: ${MB_POSTGRES_PASSWORD:-metabase_pw}
      MB_DB_HOST: metabase-db

      # Keep local runs quiet/reproducible.
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Madrid}
    restart: unless-stopped

volumes:
  metabase_postgres_data: {}
