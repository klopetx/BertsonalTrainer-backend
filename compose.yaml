name: bertsonaltrainer-backend

services:
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - type: bind
        source: "${HOST_VOLUMES_ROOT:-K:/MASTER_BIG_DATA/TFM/VOLUMES}/kafka"
        target: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", ">/dev/tcp/127.0.0.1/9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - session-events
      - --partitions
      - "1"
      - --replication-factor
      - "1"
      - --config
      - retention.ms=259200000
      - --config
      - min.insync.replicas=1
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - type: bind
        source: "${HOST_VOLUMES_ROOT:-K:/MASTER_BIG_DATA/TFM/VOLUMES}/minio"
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -e;
      mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD";
      mc mb --ignore-existing local/bronze;
      mc mb --ignore-existing local/silver;
      mc mb --ignore-existing local/system
    restart: "no"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bertsonal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bertsonal_pw}
      POSTGRES_DB: ${POSTGRES_DB:-bertsonal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-bertsonal} -d ${POSTGRES_DB:-bertsonal}"
      interval: 10s
      timeout: 5s
      retries: 5

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    volumes:
      - type: bind
        source: ./data/reference
        target: /opt/app/data/reference
        read_only: true
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: session-events
      REFERENCE_DICT: /opt/app/data/reference/ordered_basque_dictionary.csv
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--help"]
    profiles: ["simulator"]

  spark-streaming:
    build:
      context: .
      dockerfile: services/spark/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: session-events
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      DICTIONARY_PATH: /opt/app/data/reference/ordered_basque_dictionary.csv
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-bertsonal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bertsonal_pw}
      POSTGRES_DB: ${POSTGRES_DB:-bertsonal}
      SPARK_CHECKPOINT_ROOT: s3a://system/checkpoints/streaming
    volumes:
      - type: bind
        source: ./data/reference
        target: /opt/app/data/reference
        read_only: true
    restart: unless-stopped

  spark-batch:
    build:
      context: .
      dockerfile: services/spark/Dockerfile
    entrypoint: ["python", "-m", "bertsonal_spark.batch.main"]
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SILVER_SESSIONS_PATH: s3a://silver/sessions
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-bertsonal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bertsonal_pw}
      POSTGRES_DB: ${POSTGRES_DB:-bertsonal}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Madrid}
      BUSINESS_DAY_CUTOFF_HOUR: ${BUSINESS_DAY_CUTOFF_HOUR:-1}
    volumes:
      - type: bind
        source: ./data/reference
        target: /opt/app/data/reference
        read_only: true

  scheduler:
    build:
      context: .
      dockerfile: services/spark/Dockerfile
    command: ["python", "-m", "bertsonal_spark.scheduler.main"]
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SILVER_SESSIONS_PATH: s3a://silver/sessions
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-bertsonal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bertsonal_pw}
      POSTGRES_DB: ${POSTGRES_DB:-bertsonal}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Madrid}
      BUSINESS_DAY_CUTOFF_HOUR: ${BUSINESS_DAY_CUTOFF_HOUR:-1}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-300}
      DICTIONARY_PATH: /opt/app/data/reference/ordered_basque_dictionary.csv
    volumes:
      - type: bind
        source: ./data/reference
        target: /opt/app/data/reference
        read_only: true

volumes:
  postgres_data: {}
